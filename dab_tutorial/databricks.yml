# This is a Declarative Automation Bundle definition for dab_tutorial.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab_tutorial
  uuid: 9ace7c13-1c76-4b8b-8a1e-8c4178a80af5

include:
  - resources/*.yml
  - resources/*/*.yml



targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: adb-7405610424495669.9.azuredatabricks.net
      
    permissions:
      - group_name: admins
        level: CAN_MANAGE
    presets:
      name_prefix: ${workspace.current_user.short_name}
      source_linked_deployment: false

  prod:
    mode: production
    workspace:
      host: adb-7405610424495669.9.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/gautam.deepankar@outlook.com to make sure we only have a single copy.
      root_path: /Workspace/PROD/.bundle/${bundle.name}/${bundle.target}

    permissions:
      - user_name: gautam.deepankar@outlook.com
        level: CAN_MANAGE
      - group_name: admins
        level : CAN_RUN
